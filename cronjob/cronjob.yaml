apiVersion: batch/v1
kind: CronJob
metadata:
  name: hola-cronjob
spec:
  schedule: "*/2 * * * *"
  suspend: false
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: hola
              image: busybox:1.36
              command: ["/bin/sh", "-c", "date; echo Hola desde Kubernetes - CronJob modificado"]
          restartPolicy: OnFailure