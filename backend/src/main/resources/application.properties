spring.application.name=usuarios-api

# Conexión a la base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/usuarios_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:12345678}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${JWT_SECRET:una-clave-secreta-muy-larga-y-dificil-de-adivinar-2026-utesa}
app.jwt.expiration=86400000

# UPLOADS
app.s3.bucket=${S3_BUCKET:}
server.forward-headers-strategy=framework
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB