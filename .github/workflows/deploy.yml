name: Deploy serverless

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-serverless
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
  TF_VAR_db_url: ${{ secrets.DATABASE_URL }}
  TF_VAR_db_user: ${{ secrets.DB_USER }}
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
  TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: usuarios_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Instalar dependencias
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B dependency:resolve

      - name: Test
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/usuarios_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: secreto-solo-para-tests-0123456789-0123456789
        run: ./mvnw -B test

      - name: Build
        working-directory: backend
        run: ./mvnw -B package -DskipTests

      - name: Empaquetar Lambda
        run: cp backend/target/*.jar backend/lambda-package/app.jar

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply (Deploy Lambda)
        working-directory: terraform
        run: terraform apply -input=false -auto-approve tfplan