apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuarios-frontend
  labels:
    app: usuarios-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usuarios-frontend
  template:
    metadata:
      labels:
        app: usuarios-frontend
    spec:
      containers:
        - name: frontend
          image: usuarios-frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5